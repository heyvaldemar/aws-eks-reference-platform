# A container without requests is invisible to the scheduler's arithmetic,
# and one without a memory limit can take the node's memory from its
# neighbours. CPU limits are deliberately not required: they throttle a
# container even when the node has idle CPU.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-requests-limits
  annotations:
    policies.kyverno.io/description: Every container in a tenant namespace requests CPU and memory and has a memory limit.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  # Kyverno compiles this into a ValidatingAdmissionPolicy that the API server
  # enforces itself. A Kyverno outage removes Kyverno's webhooks (tests/e2e
  # proves it); it does not remove this.
  autogen:
    validatingAdmissionPolicy:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchLabels:
        platform.heyvaldemar.com/tenant: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  variables:
    # One expression for a Pod and for everything that makes Pods, written
    # out rather than left to Kyverno's autogen: autogen would rule out the
    # native ValidatingAdmissionPolicy below.
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        object.spec.template.spec
    - name: containers
      expression: >-
        variables.podSpec.containers +
        (has(variables.podSpec.initContainers) ? variables.podSpec.initContainers : [])
  validations:
    - expression: >-
        variables.containers.all(c,
          has(c.resources) &&
          has(c.resources.requests) && 'cpu' in c.resources.requests && 'memory' in c.resources.requests &&
          has(c.resources.limits) && 'memory' in c.resources.limits)
      message: every container needs requests.cpu, requests.memory and limits.memory
