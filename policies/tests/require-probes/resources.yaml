apiVersion: apps/v1
kind: Deployment
metadata:
  name: probed
  namespace: tenant
spec:
  selector: {matchLabels: {app: probed}}
  template:
    metadata: {labels: {app: probed}}
    spec:
      containers:
        - name: app
          image: ghcr.io/stefanprodan/podinfo:6.15.0@sha256:ec73780a8425f59ea49f5bc8cdff0d598805a224fbaa1f86c67a244f250fa9da
          readinessProbe: {httpGet: {path: /readyz, port: 9898}}
          livenessProbe: {httpGet: {path: /healthz, port: 9898}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: no-liveness
  namespace: tenant
spec:
  serviceName: no-liveness
  selector: {matchLabels: {app: no-liveness}}
  template:
    metadata: {labels: {app: no-liveness}}
    spec:
      containers:
        - name: app
          image: ghcr.io/stefanprodan/podinfo:6.15.0@sha256:ec73780a8425f59ea49f5bc8cdff0d598805a224fbaa1f86c67a244f250fa9da
          readinessProbe: {httpGet: {path: /readyz, port: 9898}}
