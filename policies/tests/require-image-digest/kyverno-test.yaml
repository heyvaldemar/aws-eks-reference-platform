apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-image-digest
policies:
  - ../../require-image-digest.yaml
resources:
  - resources.yaml
variables: values.yaml
results:
  - isValidatingPolicy: true
    policy: require-image-digest
    kind: Pod
    resources: [pinned]
    result: pass
  - isValidatingPolicy: true
    policy: require-image-digest
    kind: Pod
    resources: [tag-only]
    result: fail
  - isValidatingPolicy: true
    policy: require-image-digest
    kind: Deployment
    resources: [init-tag-only]
    result: fail
