# A tag can be moved to different bytes after the image was reviewed; a digest
# cannot. Pods, and the Deployments, StatefulSets, DaemonSets, Jobs and
# CronJobs that make them, are refused unless every container image is
# referenced by digest.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-image-digest
  annotations:
    policies.kyverno.io/description: Every container image in a tenant namespace is referenced by digest.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    namespaceSelector:
      matchLabels:
        platform.heyvaldemar.com/tenant: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: >-
        object.spec.containers.all(c, c.image.contains('@sha256:')) &&
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c, c.image.contains('@sha256:'))) &&
        (!has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(c, c.image.contains('@sha256:')))
      message: >-
        every image must be referenced by digest (repository:tag@sha256:...);
        a tag alone can point at different bytes tomorrow
