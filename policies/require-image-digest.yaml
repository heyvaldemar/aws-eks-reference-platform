# A tag can be moved to different bytes after the image was reviewed; a digest
# cannot. Pods, and the Deployments, StatefulSets, DaemonSets, Jobs and
# CronJobs that make them, are refused unless every container image is
# referenced by digest.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-image-digest
  annotations:
    policies.kyverno.io/description: Every container image in a tenant namespace is referenced by digest.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  # Kyverno compiles this into a ValidatingAdmissionPolicy that the API server
  # enforces itself. A Kyverno outage removes Kyverno's webhooks (tests/e2e
  # proves it); it does not remove this.
  autogen:
    validatingAdmissionPolicy:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchLabels:
        platform.heyvaldemar.com/tenant: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  variables:
    # One expression for a Pod and for everything that makes Pods, written
    # out rather than left to Kyverno's autogen: autogen would rule out the
    # native ValidatingAdmissionPolicy below.
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        object.spec.template.spec
    - name: containers
      expression: >-
        variables.podSpec.containers +
        (has(variables.podSpec.initContainers) ? variables.podSpec.initContainers : []) +
        (has(variables.podSpec.ephemeralContainers) ? variables.podSpec.ephemeralContainers : [])
  validations:
    - expression: variables.containers.all(c, c.image.contains('@sha256:'))
      message: >-
        every image must be referenced by digest (repository:tag@sha256:...);
        a tag alone can point at different bytes tomorrow
