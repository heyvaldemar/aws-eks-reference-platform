name: EKS validation run

# ADR 10. Applies the EKS Terraform in the maintainer's own AWS account,
# installs the platform from this commit, runs tests/eks/run.sh against it,
# and destroys everything whatever happened, then looks for anything left and
# reports what the run cost. The first passing run, on 2026-10-15, took 0.81 h
# and cost about $0.20 by its own estimate; one that waits out its timeouts
# has cost up to about $0.45.
#
# Weekly on a schedule, and by hand on main when the dispatch says SPEND. The
# schedule does nothing until the repository variable AWS_VALIDATION_ENABLED
# is true, and setting it to anything else stops it without a commit. The
# account stops spending on its own at $30 a month (terraform/bootstrap-aws),
# and a daily sweeper with a delete-only role removes what a run left behind.
on:
  schedule:
    # Wednesday: after Monday's Dependabot updates have merged, so the week's
    # pins reach AWS in days, not a week later.
    - cron: "17 1 * * 3"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type SPEND to create billed AWS resources (about $0.20 a passing run, up to about $0.50)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: eks-validation
  cancel-in-progress: false

env:
  RUN_ID: ${{ github.run_id }}
  CLUSTER_NAME: reference-platform-${{ github.run_id }}
  TF_IN_AUTOMATION: "1"
  TERRAFORM_VERSION: 1.16.5

jobs:
  up:
    name: Apply, install, check
    if: github.ref == 'refs/heads/main' && (inputs.confirm == 'SPEND' || (github.event_name == 'schedule' && vars.AWS_VALIDATION_ENABLED == 'true'))
    runs-on: ubuntu-latest
    environment: aws-validation
    timeout-minutes: 100
    permissions:
      contents: read
      # The OIDC token the creation role trusts, for this environment only.
      id-token: write
    outputs:
      started: ${{ steps.start.outputs.at }}
      cleaned: ${{ steps.cleanup.outputs.done }}
    steps:
      - name: Start the clock
        id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned tools
        run: |
          pip install --quiet --user --require-hashes -r .github/requirements-ci.txt
          ./scripts/install-tools.sh >> "$GITHUB_PATH"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Assume the creation role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_CREATE_ROLE_ARN }}
          role-session-name: eks-validation-${{ github.run_id }}
          role-duration-seconds: 7200
          aws-region: ${{ vars.AWS_REGION }}

      # Charts from public.ecr.aws (Karpenter's) are pulled to render the
      # expected Applications. Anonymously, a GitHub-hosted runner shares its
      # address's data limit and the fourth run got 429 "Data limit
      # exceeded"; logged in with the run's role, the pull is the account's.
      - name: Log in to Amazon ECR Public
        run: aws ecr-public get-login-password --region us-east-1 | helm registry login --username AWS --password-stdin public.ecr.aws

      # The run's variables go to the state bucket beside its state, so the
      # teardown job and the sweeper destroy exactly what this job applied.
      - name: The run's variables
        env:
          DOMAIN: ${{ vars.VALIDATION_DOMAIN }}
          ZONE_ID: ${{ vars.VALIDATION_ZONE_ID }}
          BOUNDARY: ${{ vars.IAM_PERMISSIONS_BOUNDARY }}
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          ip="$(curl -fsS https://checkip.amazonaws.com | tr -d '\n')"
          python3 - "$ip" > run.tfvars.json <<'PY'
          import json, os, sys
          print(json.dumps({
              "domain": os.environ["DOMAIN"],
              "zone_id": os.environ["ZONE_ID"],
              "run_id": os.environ["RUN_ID"],
              "cluster_name": os.environ["CLUSTER_NAME"],
              "iam_permissions_boundary": os.environ["BOUNDARY"],
              "acme_environment": "staging",
              "cluster_endpoint_public_access_cidrs": [sys.argv[1] + "/32"],
          }, indent=1))
          PY
          aws s3 cp run.tfvars.json "s3://$BUCKET/runs/$RUN_ID.tfvars.json"

      - name: Terraform init, one state per run
        env:
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          printf 'terraform {\n  backend "s3" {}\n}\n' > terraform/ci_backend.tf
          terraform -chdir=terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=$BUCKET" -backend-config="key=runs/$RUN_ID.tfstate" \
            -backend-config="region=$REGION" -backend-config="use_lockfile=true"

      - name: Apply
        id: apply
        run: terraform -chdir=terraform apply -input=false -auto-approve -var-file="$PWD/run.tfvars.json"

      - name: Install the platform from this commit
        env:
          SKIP_PUSH_CHECK: "1"
          PLATFORM_REPO_URL: https://github.com/${{ github.repository }}
          PLATFORM_REVISION: ${{ github.sha }}
        run: make eks-bootstrap

      - name: Wait for every Application the platform generates
        run: |
          export CLUSTER_NAME AWS_REGION
          VPC_ID="$(terraform -chdir=terraform output -raw vpc_id)" \
          DOMAIN="$(terraform -chdir=terraform output -raw domain)" \
          CLUSTER_ISSUER="$(terraform -chdir=terraform output -raw cluster_issuer)" \
          VELERO_BUCKET="$(terraform -chdir=terraform output -raw velero_bucket)" \
          KARPENTER_NODE_ROLE="$(terraform -chdir=terraform output -raw karpenter_node_role)" \
          KARPENTER_INTERRUPTION_QUEUE="$(terraform -chdir=terraform output -raw karpenter_interruption_queue)" \
            python3 scripts/render.py eks out/eks >/dev/null
          EXPECTED_APPS="$(python3 -c 'import yaml; print(" ".join(a["metadata"]["name"] for a in yaml.safe_load_all(open("out/eks/_applications.yaml")) if a))')" \
            ./scripts/wait-for-platform.sh 2700

      - name: The EKS checks
        env:
          DOMAIN: ${{ vars.VALIDATION_DOMAIN }}
          ZONE_ID: ${{ vars.VALIDATION_ZONE_ID }}
        run: VELERO_BUCKET="$(terraform -chdir=terraform output -raw velero_bucket)" ./tests/eks/run.sh

      - name: Evidence
        if: always() && steps.apply.outcome != 'skipped'
        run: |
          mkdir -p evidence
          kubectl get nodes -o wide > evidence/nodes.txt 2>&1 || true
          kubectl get pods -A -o wide > evidence/pods.txt 2>&1 || true
          kubectl -n argocd get applications > evidence/applications.txt 2>&1 || true
          # Why an Application is not Synced is in its conditions, and why
          # Argo CD could not read or render something is in these two logs.
          kubectl -n argocd get applications -o yaml > evidence/applications.yaml 2>&1 || true
          kubectl -n argocd logs deployment/argocd-repo-server --tail=400 > evidence/argocd-repo-server.log 2>&1 || true
          kubectl -n argocd logs statefulset/argocd-application-controller --tail=400 > evidence/argocd-application-controller.log 2>&1 || true
          ./scripts/diagnose.sh > evidence/diagnose.txt 2>&1 || true
          terraform -chdir=terraform output -json > evidence/outputs.json 2>&1 || true
          cp run.tfvars.json evidence/

      - name: Upload the evidence
        if: always() && steps.apply.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eks-validation-${{ github.run_id }}
          path: evidence/
          retention-days: 90

      # From this runner, whose address the API server allows: delete what
      # controllers made in AWS before Terraform removes the network.
      - name: Delete what controllers made in AWS
        id: cleanup
        if: always() && steps.apply.outcome != 'skipped'
        run: ./scripts/eks-cleanup.sh && echo "done=true" >> "$GITHUB_OUTPUT"

  down:
    name: Destroy, look for residue, report the cost
    needs: up
    # Whatever happened to the run, unless it never started for real.
    if: always() && github.ref == 'refs/heads/main' && (inputs.confirm == 'SPEND' || (github.event_name == 'schedule' && vars.AWS_VALIDATION_ENABLED == 'true'))
    runs-on: ubuntu-latest
    environment: aws-validation
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned tools
        run: ./scripts/install-tools.sh >> "$GITHUB_PATH"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Assume the creation role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_CREATE_ROLE_ARN }}
          role-session-name: eks-validation-down-${{ github.run_id }}
          role-duration-seconds: 3600
          aws-region: ${{ vars.AWS_REGION }}

      - name: The run's variables and state
        id: state
        env:
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          if ! aws s3 cp "s3://$BUCKET/runs/$RUN_ID.tfvars.json" run.tfvars.json; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            echo "the run wrote no variables: nothing was applied"
            exit 0
          fi
          echo "applied=true" >> "$GITHUB_OUTPUT"
          printf 'terraform {\n  backend "s3" {}\n}\n' > terraform/ci_backend.tf
          terraform -chdir=terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=$BUCKET" -backend-config="key=runs/$RUN_ID.tfstate" \
            -backend-config="region=$REGION" -backend-config="use_lockfile=true"

      # The run's own job cleans up from the address the API server allows.
      # If it died first, this runner adds its own address and does the same.
      - name: Clean up from here if the run could not
        if: steps.state.outputs.applied == 'true' && needs.up.outputs.cleaned != 'true'
        run: |
          if ! aws eks describe-cluster --name "$CLUSTER_NAME" >/dev/null 2>&1; then
            echo "no cluster $CLUSTER_NAME: nothing inside it to clean"; exit 0
          fi
          ip="$(curl -fsS https://checkip.amazonaws.com | tr -d '\n')"
          id="$(aws eks update-cluster-config --name "$CLUSTER_NAME" \
            --resources-vpc-config "endpointPublicAccess=true,publicAccessCidrs=$ip/32" --query update.id --output text)"
          for _ in $(seq 1 60); do
            status="$(aws eks describe-update --name "$CLUSTER_NAME" --update-id "$id" --query update.status --output text)"
            [ "$status" = Successful ] && break
            [ "$status" = Failed ] && { echo "could not open the API to $ip"; exit 1; }
            sleep 15
          done
          aws eks update-kubeconfig --name "$CLUSTER_NAME"
          ./scripts/eks-cleanup.sh

      # In three steps, because controllers inside the cluster made AWS
      # resources Terraform does not know: the load balancers go before the
      # cluster, the cluster goes, then its controllers' security groups and
      # any volume left available, and only then the network.
      - name: Destroy
        if: steps.state.outputs.applied == 'true'
        run: |
          ip="$(curl -fsS https://checkip.amazonaws.com | tr -d '\n')"
          vars=(-var-file="$PWD/run.tfvars.json" -var "cluster_endpoint_public_access_cidrs=[\"$ip/32\"]")
          cleanup=0
          ./scripts/aws-controller-cleanup.sh "$CLUSTER_NAME" before || cleanup=1
          terraform -chdir=terraform destroy -input=false -auto-approve -target=aws_eks_cluster.this "${vars[@]}"
          ./scripts/aws-controller-cleanup.sh "$CLUSTER_NAME" after || cleanup=1
          terraform -chdir=terraform destroy -input=false -auto-approve "${vars[@]}"
          [ "$cleanup" = 0 ] || { echo "::warning::something the cluster's controllers made could not be deleted; the residue search below says what"; }

      - name: Nothing left behind
        run: ./scripts/aws-residue.sh "$RUN_ID" "$CLUSTER_NAME"

      - name: What the run cost
        if: always()
        env:
          STARTED: ${{ needs.up.outputs.started }}
        run: python3 scripts/aws-cost-report.py "$CLUSTER_NAME" "${STARTED:-$(date +%s)}" "$(date +%s)" || true
