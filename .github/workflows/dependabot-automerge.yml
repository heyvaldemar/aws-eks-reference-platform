name: Dependabot auto-merge

# Merges a Dependabot pull request once BOTH of this repository's gates have
# finished green for that commit: Verification and the kind e2e run. It runs
# when either one completes and merges only if the other has completed green
# too, so whichever finishes last does the merge.
#
# IT USED TO RUN ON THE KIND E2E ALONE, on the belief that the e2e was always
# the slower of the two. On 2026-10-25 Verification finished after it on both
# Dependabot pull requests (#16, #17): this job found Verification still
# running, read that as "not green", and left both open with every check
# passing until the heartbeat reported them 45 hours later.
#
# NOT `gh pr merge --auto`. That hands the decision to GitHub's auto-merge,
# which waits for the checks a branch protection rule marks as REQUIRED. Where
# no rule marks any, nothing is required, and auto-merge merges the pull
# request immediately — before the verification it was supposed to wait for.
# Triggering on the gates' own completion removes that dependency: if a gate
# did not conclude success, this job does nothing at all.
on:
  workflow_run:
    workflows: ["kind e2e", "Verification"]
    types: [completed]

# One merge attempt per commit at a time. When both gates finish within
# seconds of each other, the second run waits for the first, then finds the
# pull request already merged and stops.
concurrency:
  group: dependabot-automerge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

# READ AT THE TOP, WRITE ONLY WHERE IT IS USED. A top-level block applies to
# every job in the file, including ones added later; OpenSSF Scorecard scores
# that as Token-Permissions 0/10 and it is right to. The merge job below is
# the only thing here that writes anything.
permissions:
  contents: read

jobs:
  merge:
    name: Merge the update if both gates passed
    permissions:
      contents: write
      pull-requests: write
      # To dispatch both gates on main once the merge is in.
      actions: write
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Merge, if this was Dependabot and both gates were green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # The pull request is found from the commit rather than passed in:
          # workflow_run carries the run, not the pull request that caused it.
          pr="$(gh api "repos/$REPO/commits/$SHA/pulls" \
                 --jq '.[] | select(.state=="open") | select(.user.login=="dependabot[bot]") | .number' \
                 | head -1)"
          if [ -z "$pr" ]; then
            echo "no open Dependabot pull request at $SHA — nothing to do"
            exit 0
          fi
          # Both gates, whichever of them started this run. A gate still
          # running has no conclusion yet; when it completes, it starts this
          # job again and that run decides.
          for gate in verification.yml kind-e2e.yml; do
            state="$(gh api "repos/$REPO/actions/workflows/$gate/runs?head_sha=$SHA&event=pull_request" \
                      --jq '.workflow_runs[0] | "\(.status // "missing")/\(.conclusion // "none")"')"
            if [ "$state" != completed/success ]; then
              echo "$gate for $SHA is $state; not merging #$pr yet"
              exit 0
            fi
          done
          echo "kind e2e and Verification passed for #$pr; merging"
          # Squash where the repository allows it, a plain merge where it does
          # not. A repository with squash disabled would otherwise fail here
          # every week, and a job that fails every week is one nobody reads.
          gh pr merge "$pr" --repo "$REPO" --squash --delete-branch \
            || gh pr merge "$pr" --repo "$REPO" --merge --delete-branch
          # THE MERGE IS PUSHED WITH GITHUB_TOKEN, AND GITHUB RUNS NO WORKFLOWS
          # FOR PUSHES MADE WITH IT. So main would land with no checks on its
          # head: the pull request was verified, the merge result was not, and
          # the repository page would show its latest commit with no tick. On
          # 2026-09-17 that was fourteen repositories out of ninety-four, up
          # from four two days earlier, growing with every merge.
          #
          # workflow_dispatch is the documented exception to that rule. Both
          # gates this job waited on are asked to run again, on main as merged.
          gh workflow run kind-e2e.yml --repo "$REPO" --ref main
          gh workflow run verification.yml --repo "$REPO" --ref main
          echo "kind e2e and Verification dispatched on main as merged"
