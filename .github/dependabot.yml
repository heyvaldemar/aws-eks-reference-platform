# Keeps the pinned GitHub Actions, the Terraform provider and CI's one Python
# package (.github/requirements-ci.txt, hash-pinned) current. Charts,
# images and CLI tools are not in any ecosystem Dependabot reads here; the
# Verification workflow's weekly freshness job reports those
# (scripts/check-freshness.py) and fleet triage moves them.
#
# Grouped: one pull request per ecosystem per week is a queue that gets read.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # HELD UNTIL THE SCHEDULED EKS RUN OF 25 NOVEMBER 2026 HAS ENDED. The EKS
    # workflow's aws-actions/configure-aws-credentials runs nowhere but on AWS,
    # and that run is the second scheduled pass in a row the site's "weekly"
    # waits for: it carries only what kind or the Terraform test has already
    # seen. Remove this line then. Security updates are not held by it.
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
    commit-message:
      prefix: deps
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: gomod
    directory: /tools/kubectl-tenant
    schedule:
      interval: weekly
    groups:
      gomod:
        patterns: ["*"]
    commit-message:
      prefix: deps
