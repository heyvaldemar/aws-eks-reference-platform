# A generated VAP does not excuse any other condition: the reports controller
# missing its permissions is still Degraded, and the message names it.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-probes
  generation: 1
  annotations:
    reference-platform.test/expect-health: Degraded
    reference-platform.test/expect-message: "RBACPermissionsGranted: "
status:
  conditionStatus:
    conditions:
      - message: Admission is enforced by the generated ValidatingAdmissionPolicy.
        reason: Succeeded
        status: "True"
        type: WebhookConfigured
      - message: "Policy is not ready for reporting, missing permissions: list apps/v1, Resource=deployments."
        reason: Failed
        status: "False"
        type: RBACPermissionsGranted
    ready: false
  generated: true
