alertmanager:
  alertmanagerSpec:
    replicas: 2
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {memory: 256Mi}
prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 50Gi
