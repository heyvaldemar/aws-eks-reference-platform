# The policies are CEL ValidatingPolicy and GeneratingPolicy objects
# (policies.kyverno.io/v1). Kyverno 1.19 marks the older kyverno.io
# ClusterPolicy deprecated; nothing here uses it.
admissionController:
  container:
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {memory: 512Mi}
backgroundController:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
cleanupController:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}
reportsController:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
