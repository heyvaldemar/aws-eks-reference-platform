# Every image this component runs, pinned by digest. A tag can be moved to
# different bytes after it was reviewed; a digest cannot. scripts/check-images.py
# fails CI on any rendered image without one, and scripts/check-freshness.py
# names each pin a chart bump or a re-pushed tag has left behind.
crds:
  migration:
    image:
      registry: reg.kyverno.io
      repository: kyverno/kyverno-cli
      tag: v1.20.0-rc.5@sha256:698ec29568c43b89cd870c1a7ef061b9e22a881e36bc74c365ae3f091ef7af51
upgrade:
  # Since 1.20 a hook checks for policies Kyverno no longer runs before it
  # installs or upgrades. It runs the CLI image.
  legacyPolicyCheck:
