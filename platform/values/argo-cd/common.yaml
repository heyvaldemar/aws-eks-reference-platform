# Argo CD as this platform runs it: no Dex and no notifications (a reference
# has no SSO or chat to wire them to), ApplicationSets on, every component
# with requests and a memory limit.
configs:
  cm:
    # Every sync runs as the service account its project names
    # (destinationServiceAccounts), not as the controller. A tenant's sync
    # runs as tenant-<team>-deployer, which may touch only the kinds on its
    # allow-list in its own namespace, so the API server's RBAC backs the
    # project. Enforced: a project that names no account cannot sync at all.
    application.sync.impersonation.enabled: "true"
    application.sync.impersonation.enforced: "true"
  params:
    # Diff against a server-side dry run of the apply, not against the bare
    # manifest: fields the API server defaults (Gateway API, CRD conversion
    # settings, StatefulSet claim templates) stop showing as drift.
    controller.diff.server.side: "true"
dex:
  enabled: false
notifications:
  enabled: false
controller:
  # An upgrade that changes existing CRDs makes the controller reload the
  # whole cluster's OpenAPI schema once per CRD event (gitops-engine
  # pkg/cache/cluster.go), with its cache full. Moving v1.2.0 to v1.3.0's
  # charts, about a hundred CRDs, it was OOMKilled again and again at 1Gi;
  # read from its cgroup, the controller that finished that upgrade peaked at
  # 1631 MiB (kind e2e run 40576202356), while a fresh install fits in 1Gi.
  # 4Gi is the limit that run had. GOMEMLIMIT at about 90% of it makes Go
  # collect before the kernel kills the process, as Argo CD's
  # high-availability guide advises. bootstrap/bootstrap.sh reads both lines
  # below and gives them to a running controller before the new charts.
  env: [{name: GOMEMLIMIT, value: 3600MiB}]
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 4Gi}
server:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}
repoServer:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
applicationSet:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}
redis:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}
