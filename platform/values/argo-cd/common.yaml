# Argo CD as this platform runs it: no Dex and no notifications (a reference
# has no SSO or chat to wire them to), ApplicationSets on, every component
# with requests and a memory limit.
configs:
  cm:
    # Every sync runs as the service account its project names
    # (destinationServiceAccounts), not as the controller. A tenant's sync
    # runs as tenant-<team>-deployer, which may touch only the kinds on its
    # allow-list in its own namespace, so the API server's RBAC backs the
    # project. Enforced: a project that names no account cannot sync at all.
    application.sync.impersonation.enabled: "true"
    application.sync.impersonation.enforced: "true"
    # Argo CD 3.6.1's own health check for Kyverno's ValidatingPolicy, changed
    # in one place. Kyverno 1.19 can leave a policy at ready=false with
    # "WebhookConfigured: Policy is not configured in the webhook." while the
    # ValidatingAdmissionPolicy generated from it enforces it, at random among
    # policies applied together (kyverno/kyverno#17088): two of our four, for
    # good, in five of six batches on 1.19.2. Argo CD 3.6 reads that as
    # Degraded, and an install of v1.3.1 timed out on it. On a policy whose
    # VAP was generated, WebhookConfigured=False is therefore not a failure,
    # which is how Kyverno 1.20 decides it itself (kyverno/kyverno#17119).
    # Any other False condition is still Degraded. tests/static/argocd-health
    # holds the cases. Drop this key at the first of two: Kyverno 1.20 GA, or a
    # Kyverno 1.19.3 that carries #17119 (a cherry-pick was asked for on the PR
    # on 2026-11-09). Then the fixture that expects Healthy and its three plants go.
    resource.customizations.health.policies.kyverno.io_ValidatingPolicy: |
      local hs = {}
      if obj.status ~= nil and obj.status.conditionStatus ~= nil then
        local cs = obj.status.conditionStatus
        if obj.metadata.generation ~= nil and cs.conditions ~= nil then
          for _, condition in ipairs(cs.conditions) do
            if condition.observedGeneration ~= nil and condition.observedGeneration < obj.metadata.generation then
              hs.status = "Progressing"
              hs.message = "Waiting for ValidatingPolicy status to reflect latest generation"
              return hs
            end
          end
        end
        if cs.ready == true then
          hs.status = "Healthy"
          if cs.conditions ~= nil then
            for _, condition in ipairs(cs.conditions) do
              if condition.type == "WebhookConfigured" and condition.status == "True" then
                hs.message = condition.message
                break
              end
            end
          end
          if hs.message == nil then
            hs.message = "Policy is ready"
          end
          return hs
        end
        local vap = obj.status.generated == true
        local webhookOnly, failed = false, nil
        if cs.conditions ~= nil then
          for _, condition in ipairs(cs.conditions) do
            if condition.status == "False" then
              if vap and condition.type == "WebhookConfigured" then
                webhookOnly = true
              elseif failed == nil then
                failed = condition
              end
            end
          end
        end
        if webhookOnly and failed == nil then
          hs.status = "Healthy"
          hs.message = "Admission is enforced by the generated ValidatingAdmissionPolicy; WebhookConfigured=False is kyverno/kyverno#17088"
          return hs
        end
        hs.status = "Degraded"
        if failed ~= nil then
          hs.message = failed.type .. ": " .. failed.message
          return hs
        end
        if cs.conditions ~= nil then
          for _, condition in ipairs(cs.conditions) do
            if condition.status == "False" then
              hs.message = condition.type .. ": " .. condition.message
              return hs
            end
          end
        end
        hs.message = (cs.message ~= nil and cs.message ~= "") and cs.message or "Policy is not ready"
        return hs
      end
      hs.status = "Progressing"
      hs.message = "Waiting for ValidatingPolicy status"
      return hs
  params:
    # Diff against a server-side dry run of the apply, not against the bare
    # manifest: fields the API server defaults (Gateway API, CRD conversion
    # settings, StatefulSet claim templates) stop showing as drift.
    controller.diff.server.side: "true"
dex:
  enabled: false
notifications:
  enabled: false
controller:
  # An upgrade that changes existing CRDs makes the controller reload the
  # whole cluster's OpenAPI schema once per CRD event (gitops-engine
  # pkg/cache/cluster.go), with its cache full. Moving v1.2.0 to v1.3.0's
  # charts, about a hundred CRDs, it was OOMKilled again and again at 1Gi;
  # read from its cgroup, the controller that finished that upgrade peaked at
  # 1631 MiB (kind e2e run 40576202356), while a fresh install fits in 1Gi.
  # 4Gi is the limit that run had. GOMEMLIMIT at about 90% of it makes Go
  # collect before the kernel kills the process, as Argo CD's
  # high-availability guide advises. bootstrap/bootstrap.sh reads both lines
  # below and gives them to a running controller before the new charts.
  env: [{name: GOMEMLIMIT, value: 3600MiB}]
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 4Gi}
server:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}
repoServer:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
applicationSet:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}
redis:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}
