# Every image this component runs, pinned by digest. A tag can be moved to
# different bytes after it was reviewed; a digest cannot. scripts/check-images.py
# fails CI on any rendered image without one, and scripts/pin-images.py is how
# these lines are moved when the chart version changes.
global:
  images:
    envoyGateway:
      image: docker.io/envoyproxy/gateway:v1.9.2@sha256:9d67017c442a70e6ae9f1a358e6c80eb653c67c2e40823d9a991e0daf37ba926
    envoyProxy:
      image: docker.io/envoyproxy/envoy:distroless-v1.39.1@sha256:eb2c01c13125d1629637cb4e4cce7207009fb7cc2c8027f9742758549d15b6f4
    ratelimit:
      image: docker.io/envoyproxy/ratelimit:0482748e@sha256:5fdd8e3ae335ab6d64316f8d2fd9a886830075cbbb40a1d8065c869275909162
