# Every image this component runs, pinned by digest. A tag can be moved to
# different bytes after it was reviewed; a digest cannot. scripts/check-images.py
# fails CI on any rendered image without one, and scripts/check-freshness.py
# names each pin a chart bump or a re-pushed tag has left behind.
global:
  images:
    envoyGateway:
      image: docker.io/envoyproxy/gateway:v1.9.3@sha256:192fc9bdadb6d2462e8cf7bd702ce3dd9648f3310c6038787448a1f509b7cd9f
    envoyProxy:
      image: docker.io/envoyproxy/envoy:distroless-v1.39.1@sha256:eb2c01c13125d1629637cb4e4cce7207009fb7cc2c8027f9742758549d15b6f4
    ratelimit:
      image: docker.io/envoyproxy/ratelimit:5ae0682e@sha256:b95206e32b1a5f824fb06062fbb85bbdfb7f5de54135e92afe8462f22c979681
