# One collector Deployment: OTLP in, spanmetrics out. Traces become request
# rate, error and latency metrics that Prometheus scrapes, so "are traces
# arriving" is a PromQL query, not a tracing backend to run.
mode: deployment
# The contrib distribution: it has the spanmetrics connector and the
# Prometheus exporter. The chart has no default image, so the choice lives
# here and only the pin (tag and digest) in images.yaml.
image:
  repository: docker.io/otel/opentelemetry-collector-contrib
command:
  name: otelcol-contrib
ports:
  jaeger-compact: {enabled: false}
  jaeger-thrift: {enabled: false}
  jaeger-grpc: {enabled: false}
  zipkin: {enabled: false}
  prom-exporter:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP
config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
  connectors:
    spanmetrics:
      namespace: traces.spanmetrics
  exporters:
    prometheus:
      endpoint: ${env:MY_POD_IP}:8889
    debug:
      verbosity: basic
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [spanmetrics, debug]
      metrics:
        receivers: [otlp, spanmetrics]
        processors: [memory_limiter, batch]
        exporters: [prometheus]
      logs: null
serviceMonitor:
  enabled: true
  metricsEndpoints:
    - port: prom-exporter
      interval: 15s
resources:
  requests: {cpu: 20m, memory: 128Mi}
  limits: {memory: 512Mi}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault
