# Provisions EC2 capacity for pending pods. EKS only; the NodePool and
# EC2NodeClass it acts on live in manifests/karpenter.
#
# Generated for every cluster whose Argo CD cluster Secret carries the label
# enable_karpenter: "true" (see platform/clusters/). Values come from three files
# in this repository, read at the revision the cluster is pinned to:
# images.yaml (every image by digest), common.yaml, and <environment>.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: karpenter
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            enable_karpenter: "true"
  # A restore drill or an incident may need auto-sync off for a while; the
  # ApplicationSet leaves that switch alone instead of flipping it back.
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  template:
    metadata:
      name: karpenter
      labels:
        platform.heyvaldemar.com/component: karpenter
    spec:
      project: platform
      sources:
        - repoURL: public.ecr.aws/karpenter
          chart: karpenter
          targetRevision: 1.15.0
          helm:
            releaseName: karpenter
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/platform/values/karpenter/images.yaml
              - $values/platform/values/karpenter/common.yaml
              - $values/platform/values/karpenter/{{ .metadata.labels.environment }}.yaml
            values: |
              settings:
                clusterName: {{ .metadata.annotations.cluster_name }}
                interruptionQueue: {{ .metadata.annotations.karpenter_interruption_queue }}
        - repoURL: '{{ .metadata.annotations.platform_repo_url }}'
          targetRevision: '{{ .metadata.annotations.platform_revision }}'
          ref: values
      destination:
        name: '{{ .name }}'
        namespace: karpenter
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: latest
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/audit: restricted
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 20
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
