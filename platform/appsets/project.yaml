# The AppProject every platform Application belongs to.
#
# It names the only sources Argo CD may pull from: this repository and the
# chart repositories the ApplicationSets in this directory pin. A chart that
# is not listed here cannot be installed by editing an ApplicationSet alone;
# the project has to change too, in the same review.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: The reference platform's add-ons, configuration and demo workload.
  sourceRepos:
    # This repository, or a fork that kept its name.
    - https://github.com/*/aws-eks-reference-platform
    - https://github.com/*/aws-eks-reference-platform.git
    - git@github.com:*/aws-eks-reference-platform.git
    - https://argoproj.github.io/argo-helm
    - https://charts.jetstack.io
    - https://charts.external-secrets.io
    - https://kubernetes-sigs.github.io/external-dns/
    - docker.io/envoyproxy
    - https://kyverno.github.io/kyverno/
    - https://prometheus-community.github.io/helm-charts
    - https://open-telemetry.github.io/opentelemetry-helm-charts
    - https://vmware-tanzu.github.io/helm-charts
    - public.ecr.aws/karpenter
    - https://aws.github.io/eks-charts
  destinations:
    - name: in-cluster
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
---
# The AppProject every tenant belongs to (platform/appsets/tenants.yaml).
#
# A tenant is a directory a team controls, so its project grants what a team
# needs and nothing a platform needs: its manifests come from this repository
# only, the one cluster-scoped kind it may create is its own Namespace, it may
# not deploy into any platform namespace, it may not change the quota or
# limits the platform sets on it, and it may not write itself a policy
# exception. A ClusterRoleBinding in apps/<team>/ is refused by Argo CD before
# the API server sees it.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tenants
  namespace: argocd
spec:
  description: Tenant workloads under apps/, one namespace each.
  sourceRepos:
    - https://github.com/*/aws-eks-reference-platform
    - https://github.com/*/aws-eks-reference-platform.git
    - git@github.com:*/aws-eks-reference-platform.git
  destinations:
    - name: in-cluster
      namespace: "*"
    - name: in-cluster
      namespace: "!kube-*"
    - name: in-cluster
      namespace: "!default"
    - name: in-cluster
      namespace: "!argocd"
    - name: in-cluster
      namespace: "!cert-manager"
    - name: in-cluster
      namespace: "!envoy-gateway-system"
    - name: in-cluster
      namespace: "!external-dns"
    - name: in-cluster
      namespace: "!external-secrets"
    - name: in-cluster
      namespace: "!gateway"
    - name: in-cluster
      namespace: "!karpenter"
    - name: in-cluster
      namespace: "!kyverno"
    - name: in-cluster
      namespace: "!monitoring"
    - name: in-cluster
      namespace: "!object-store"
    - name: in-cluster
      namespace: "!velero"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  # A tenant may not exempt itself from admission policy either.
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: kyverno.io
      kind: PolicyException
    - group: policies.kyverno.io
      kind: PolicyException
  orphanedResources:
    warn: true
