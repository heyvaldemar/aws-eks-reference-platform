# Prometheus, its operator, Grafana and kube-state-metrics.
#
# Generated for every cluster whose Argo CD cluster Secret carries the label
# enable_kube_prometheus_stack: "true" (see platform/clusters/). Values come from three files
# in this repository, read at the revision the cluster is pinned to:
# images.yaml (every image by digest), common.yaml, and <environment>.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            enable_kube_prometheus_stack: "true"
  # A restore drill or an incident may need auto-sync off for a while; the
  # ApplicationSet leaves that switch alone instead of flipping it back.
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  template:
    metadata:
      name: kube-prometheus-stack
      labels:
        platform.heyvaldemar.com/component: kube-prometheus-stack
    spec:
      project: platform
      sources:
        - repoURL: https://prometheus-community.github.io/helm-charts
          chart: kube-prometheus-stack
          targetRevision: 92.14.1
          helm:
            releaseName: kube-prometheus-stack
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/platform/values/kube-prometheus-stack/images.yaml
              - $values/platform/values/kube-prometheus-stack/common.yaml
              - $values/platform/values/kube-prometheus-stack/{{ .metadata.labels.environment }}.yaml
        - repoURL: '{{ .metadata.annotations.platform_repo_url }}'
          targetRevision: '{{ .metadata.annotations.platform_revision }}'
          ref: values
      destination:
        name: '{{ .name }}'
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: latest
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/audit: restricted
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 20
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
