# The demo tenant (apps/demo): the workload every e2e check runs against.
# Its hostname is demo.<the cluster's domain>.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demo
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            enable_argo_cd: "true"
  # A restore drill or an incident may need auto-sync off for a while; the
  # ApplicationSet leaves that switch alone instead of flipping it back.
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  template:
    metadata:
      name: demo
      labels:
        platform.heyvaldemar.com/component: demo
    spec:
      project: platform
      source:
        repoURL: '{{ .metadata.annotations.platform_repo_url }}'
        targetRevision: '{{ .metadata.annotations.platform_revision }}'
        path: apps/demo/overlays/{{ .metadata.labels.environment }}
        kustomize:
          patches:
            - target:
                kind: HTTPRoute
                name: demo
              patch: |-
                - op: replace
                  path: /spec/hostnames
                  value: ["demo.{{ .metadata.annotations.domain }}"]
      destination:
        name: '{{ .name }}'
        namespace: demo
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 20
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
