# Syncs secrets into the cluster from a store outside it: AWS Secrets
# Manager on EKS, a fake provider on kind, and its Password generator for
# credentials nobody needs to know (Grafana's admin password).
#
# Generated for every cluster whose Argo CD cluster Secret carries the label
# enable_external_secrets: "true" (see platform/clusters/). Values come from three files
# in this repository, read at the revision the cluster is pinned to:
# images.yaml (every image by digest), common.yaml, and <environment>.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            enable_external_secrets: "true"
  # A restore drill or an incident may need auto-sync off for a while; the
  # ApplicationSet leaves that switch alone instead of flipping it back.
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  template:
    metadata:
      name: external-secrets
      labels:
        platform.heyvaldemar.com/component: external-secrets
    spec:
      project: platform
      sources:
        - repoURL: https://charts.external-secrets.io
          chart: external-secrets
          targetRevision: 2.14.0
          helm:
            releaseName: external-secrets
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/platform/values/external-secrets/images.yaml
              - $values/platform/values/external-secrets/common.yaml
              - $values/platform/values/external-secrets/{{ .metadata.labels.environment }}.yaml
        - repoURL: '{{ .metadata.annotations.platform_repo_url }}'
          targetRevision: '{{ .metadata.annotations.platform_revision }}'
          ref: values
      destination:
        name: '{{ .name }}'
        namespace: external-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: latest
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/audit: restricted
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 20
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
