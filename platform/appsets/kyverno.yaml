# Admission policy. The policies themselves live in policies/ and arrive
# through the policies ApplicationSet, each with a test that breaks it.
#
# Generated for every cluster whose Argo CD cluster Secret carries the label
# enable_kyverno: "true" (see platform/clusters/). Values come from three files
# in this repository, read at the revision the cluster is pinned to:
# images.yaml (every image by digest), common.yaml, and <environment>.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kyverno
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            enable_kyverno: "true"
  # A restore drill or an incident may need auto-sync off for a while; the
  # ApplicationSet leaves that switch alone instead of flipping it back.
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  template:
    metadata:
      name: kyverno
      labels:
        platform.heyvaldemar.com/component: kyverno
    spec:
      project: platform
      sources:
        - repoURL: https://kyverno.github.io/kyverno/
          chart: kyverno
          targetRevision: 3.9.2
          helm:
            releaseName: kyverno
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/platform/values/kyverno/images.yaml
              - $values/platform/values/kyverno/common.yaml
              - $values/platform/values/kyverno/{{ .metadata.labels.environment }}.yaml
        - repoURL: '{{ .metadata.annotations.platform_repo_url }}'
          targetRevision: '{{ .metadata.annotations.platform_revision }}'
          ref: values
      destination:
        name: '{{ .name }}'
        namespace: kyverno
      # The chart renders empty annotations and labels on its policies.kyverno.io
      # CRDs; the API server drops empty maps, which would read as drift forever.
      ignoreDifferences:
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jsonPointers:
            - /metadata/annotations
            - /metadata/labels
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: latest
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/audit: restricted
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 20
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
