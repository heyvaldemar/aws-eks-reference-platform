# Receives traces over OTLP and turns them into request metrics
# (spanmetrics) that Prometheus scrapes. One pipeline, no tracing backend
# to run: enough to prove traces leave the workload and arrive somewhere.
#
# Generated for every cluster whose Argo CD cluster Secret carries the label
# enable_opentelemetry_collector: "true" (see platform/clusters/). Values come from three files
# in this repository, read at the revision the cluster is pinned to:
# images.yaml (every image by digest), common.yaml, and <environment>.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: opentelemetry-collector
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            enable_opentelemetry_collector: "true"
  # A restore drill or an incident may need auto-sync off for a while; the
  # ApplicationSet leaves that switch alone instead of flipping it back.
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  template:
    metadata:
      name: opentelemetry-collector
      labels:
        platform.heyvaldemar.com/component: opentelemetry-collector
    spec:
      project: platform
      sources:
        - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
          chart: opentelemetry-collector
          targetRevision: 0.175.1
          helm:
            releaseName: opentelemetry-collector
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/platform/values/opentelemetry-collector/images.yaml
              - $values/platform/values/opentelemetry-collector/common.yaml
              - $values/platform/values/opentelemetry-collector/{{ .metadata.labels.environment }}.yaml
        - repoURL: '{{ .metadata.annotations.platform_repo_url }}'
          targetRevision: '{{ .metadata.annotations.platform_revision }}'
          ref: values
      destination:
        name: '{{ .name }}'
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: latest
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/audit: restricted
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 20
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
