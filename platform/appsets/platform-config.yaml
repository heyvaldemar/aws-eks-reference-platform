# The platform's own configuration: issuers, the Gateway and its certificate,
# the secret store, Grafana's generated password. The cluster's domain and
# certificate issuer are patched in from its Argo CD cluster Secret, so the
# files in manifests/ carry placeholders, not any one environment's values.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-config
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            enable_argo_cd: "true"
  # A restore drill or an incident may need auto-sync off for a while; the
  # ApplicationSet leaves that switch alone instead of flipping it back.
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  template:
    metadata:
      name: platform-config
      labels:
        platform.heyvaldemar.com/component: platform-config
    spec:
      project: platform
      source:
        repoURL: '{{ .metadata.annotations.platform_repo_url }}'
        targetRevision: '{{ .metadata.annotations.platform_revision }}'
        path: manifests/overlays/{{ .metadata.labels.environment }}
        kustomize:
          patches:
            - target:
                kind: Gateway
                name: platform
              patch: |-
                - op: replace
                  path: /spec/listeners/0/hostname
                  value: "*.{{ .metadata.annotations.domain }}"
                - op: replace
                  path: /spec/listeners/1/hostname
                  value: "*.{{ .metadata.annotations.domain }}"
            - target:
                kind: Certificate
                name: platform-wildcard
              patch: |-
                - op: replace
                  path: /spec/dnsNames
                  value: ["*.{{ .metadata.annotations.domain }}"]
                - op: replace
                  path: /spec/issuerRef/name
                  value: "{{ .metadata.annotations.cluster_issuer }}"
      destination:
        name: '{{ .name }}'
        namespace: gateway
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 20
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
