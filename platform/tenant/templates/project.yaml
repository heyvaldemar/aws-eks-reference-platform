# The tenant's Argo CD project. It grants what a team needs and nothing a
# platform needs: manifests from the platform repository only, one
# destination (its own namespace), no cluster-scoped kind at all, and only
# the namespaced kinds in allowedKinds (values.yaml). A manifest in
# apps/<team>/ that names another namespace, a ClusterRoleBinding or a
# RoleBinding is refused by Argo CD before the API server sees it.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tenant-{{ include "tenant.name" . }}
  namespace: argocd
spec:
  description: Tenant {{ include "tenant.name" . }}, one namespace, from apps/{{ include "tenant.name" . }}.
  sourceRepos:
    - {{ required "repoURL: the platform repository" .Values.repoURL | quote }}
  destinations:
    - name: {{ required "cluster: the cluster Secret's name" .Values.cluster | quote }}
      namespace: {{ include "tenant.name" . }}
  # Syncs run as this account (deployer.yaml), not as the controller.
  destinationServiceAccounts:
    - server: https://kubernetes.default.svc
      namespace: {{ include "tenant.name" . }}
      defaultServiceAccount: argocd:tenant-{{ include "tenant.name" . }}-deployer
  namespaceResourceWhitelist:
    {{- range .Values.allowedKinds }}
    - group: {{ .group | quote }}
      kind: {{ .kind }}
    {{- end }}
  orphanedResources:
    warn: true
