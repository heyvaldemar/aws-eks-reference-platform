# Set per tenant by platform/appsets/tenant-guardrails.yaml: the directory
# name under apps/, the cluster Secret's name and the platform repository.
# Empty here, so a render without them fails instead of guessing.
name: ""
cluster: ""
repoURL: ""

# A tenant's directory name becomes a namespace, an AppProject (tenant-<name>)
# and an Application (<name>). The names below are the platform's own
# namespaces and Applications; a directory that takes one fails to render,
# and the tenant's Application is never created because its project never
# is. Names starting with kube- or tenant- are refused as well.
# scripts/check-argocd.py fails when a platform namespace or Application
# is missing from this list.
reserved:
  - argo-cd
  - argocd
  - aws-config
  - aws-load-balancer-controller
  - cert-manager
  - default
  - envoy-gateway
  - envoy-gateway-system
  - external-dns
  - external-secrets
  - gateway
  - karpenter
  - kube-prometheus-stack
  - kyverno
  - local-path-storage
  - monitoring
  - object-store
  - opentelemetry-collector
  - platform
  - platform-config
  - policies
  - velero

# The kinds a tenant's directory may hold, and nothing else. Each is allowed
# twice: by the tenant's Argo CD project (kind), and by the Role its syncs run
# as (resource), so the API server refuses what Argo CD would. An allow-list,
# not a deny-list: a kind nobody thought of is refused until someone adds it
# here in a platform change. Left out on purpose: Role and RoleBinding (a
# team that could bind itself admin in its namespace could edit the quota
# through the API), Secret (secrets come from the store), SecretStore,
# ResourceQuota and LimitRange, Kyverno policies and exceptions, and Gateway
# (a Gateway of its own gets its own load balancer).
allowedKinds:
  - {group: "", kind: ConfigMap, resource: configmaps}
  - {group: "", kind: PersistentVolumeClaim, resource: persistentvolumeclaims}
  - {group: "", kind: Service, resource: services}
  - {group: "", kind: ServiceAccount, resource: serviceaccounts}
  - {group: apps, kind: Deployment, resource: deployments}
  - {group: apps, kind: StatefulSet, resource: statefulsets}
  - {group: autoscaling, kind: HorizontalPodAutoscaler, resource: horizontalpodautoscalers}
  - {group: batch, kind: CronJob, resource: cronjobs}
  - {group: batch, kind: Job, resource: jobs}
  - {group: external-secrets.io, kind: ExternalSecret, resource: externalsecrets}
  - {group: gateway.networking.k8s.io, kind: HTTPRoute, resource: httproutes}
  - {group: monitoring.coreos.com, kind: PodMonitor, resource: podmonitors}
  - {group: monitoring.coreos.com, kind: PrometheusRule, resource: prometheusrules}
  - {group: monitoring.coreos.com, kind: ServiceMonitor, resource: servicemonitors}
  - {group: networking.k8s.io, kind: NetworkPolicy, resource: networkpolicies}
  - {group: policy, kind: PodDisruptionBudget, resource: poddisruptionbudgets}

# What one tenant may request in total. Every container already has to
# declare CPU and memory requests and a memory limit (policies/), so the
# quota can count them. No LimitRange: its defaults would fill in what a
# team left out, and the admission policy that refuses a container without
# limits would never see one. A LoadBalancer or NodePort Service is the
# Gateway's job, so a tenant gets none.
quota:
  requests.cpu: "2"
  requests.memory: 4Gi
  limits.memory: 8Gi
  pods: "50"
  persistentvolumeclaims: "10"
  requests.storage: 50Gi
  services.loadbalancers: "0"
  services.nodeports: "0"
