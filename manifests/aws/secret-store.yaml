# AWS Secrets Manager, read with the External Secrets controller's own
# identity (EKS Pod Identity). The store has no auth block on purpose: the
# SDK's default chain finds the Pod Identity credentials.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform
spec:
  # Only the listed namespaces may read through this store; this file belongs
  # to the platform, so a tenant cannot add itself. A tenant that needs its own
  # secrets gets its own store and its own IAM role scoped to its prefix.
  conditions:
    - namespaces: [demo]
  provider:
    aws:
      service: SecretsManager
      region: placeholder-region
