# kind has no secrets manager to read from, so the store is External Secrets'
# fake provider: the same ExternalSecret objects that read AWS Secrets Manager
# on EKS read these values here. Nothing below is a secret.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform
spec:
  # Not every tenant's: a namespace may read from this store only if it is
  # listed here, and this file belongs to the platform, not to any tenant, so a
  # tenant cannot grant itself access (tests/e2e tries from team-b).
  conditions:
    - namespaces: [demo]
  provider:
    fake:
      data:
        - key: demo/message
          value: Served by the reference platform on kind, through Envoy Gateway.
