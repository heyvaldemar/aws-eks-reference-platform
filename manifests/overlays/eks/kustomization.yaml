apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - storageclass.yaml
patches:
  # Two proxies behind an internet-facing Network Load Balancer that sends
  # traffic straight to pod IPs (the AWS Load Balancer Controller makes it).
  # The Service names the controller's class itself: the controller's Service
  # webhook, which used to set it, is off (its values file says why). A
  # Service made while the webhook was on already holds this class, and the
  # field cannot change, so this value is the only one it can take.
  - target:
      kind: EnvoyProxy
      name: platform
    patch: |-
      - op: replace
        path: /spec/provider/kubernetes/envoyDeployment/replicas
        value: 2
      - op: replace
        path: /spec/provider/kubernetes/envoyService
        value:
          type: LoadBalancer
          loadBalancerClass: service.k8s.aws/nlb
          externalTrafficPolicy: Cluster
          annotations:
            service.beta.kubernetes.io/aws-load-balancer-type: external
            service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
            service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
