# A tenant: one service, its route and the network paths it needs. Replace
# TEAM everywhere with the team's name (lowercase, a DNS label), which is
# also the directory name under apps/. The namespace is not here: the
# platform creates it, labelled and under quota (platform/tenant).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: TEAM
labels:
  - pairs:
      app.kubernetes.io/part-of: TEAM
    includeSelectors: false
resources:
  - app.yaml
  - route.yaml
  - network-policies.yaml
