# The second tenant, made from apps/_template exactly as a team would make it.
# It exists to prove tenants cannot reach each other.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: team-b
labels:
  - pairs:
      app.kubernetes.io/part-of: team-b
    includeSelectors: false
resources:
  - app.yaml
  - route.yaml
  - network-policies.yaml
