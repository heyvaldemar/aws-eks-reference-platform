# The tenant label is what the platform keys on: admission policies apply
# here, a default-deny NetworkPolicy is generated here, and the Gateway
# accepts this namespace's route. Pod Security restricted is mandatory for a
# tenant (policies/require-restricted-tenant.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: team-b
  labels:
    platform.heyvaldemar.com/tenant: "true"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
